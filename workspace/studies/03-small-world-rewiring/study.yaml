schema_version: 4
name: 03-small-world-rewiring
title: Watts–Strogatz small-world rewiring
created: '2026-10-22'
status: completed
investigation: dynamic-networks
phase: Decide
question: 'How does random rewiring of a ring lattice change its structure?

  '
hypothesis: 'Rewiring a small fraction of lattice edges collapses path length while clustering stays high
  — the small-world regime — without changing node or edge counts.

  '
objective: 'Run the small_world_rewire reaction and show how it reconfigures the network, measuring its
  signature structural observables.

  '
description: 'Random rewiring of a ring lattice preserves edge count while shortcuts collapse path length
  — producing the small-world regime.


  The network is stored as process-bigraph node/edge maps and reconfigured each step by the `small_world_rewire`
  reaction (emitting _add/_remove structural sentinels). The animation and GIF in viz/ show the evolution;
  scalar metrics are emitted for the behavior tests.

  '
claim: Random rewiring of a ring lattice preserves edge count while shortcuts collapse path length — producing
  the small-world regime.
confidence: Accepted
parent_studies:
- study: 01-erdos-renyi-random-growth
  relation: builds-on
baseline:
- name: baseline
  composite: viva_dynamic_networks.composites.family_a.small_world_rewire
  params:
    p: 0.14
    n: 28.0
    k: 4.0
    seed: 7.0
visualizations:
- name: network-evolution (live)
  address: local:NetworkEvolution
  config:
    title: Watts–Strogatz small-world rewiring
    layout: circular
    color_by: degree
    subtitle: a ring lattice dissolves into a small world as random rewires accumulate
    composite: viva_dynamic_networks.composites.family_a.small_world_rewire
    n_steps: 45
    render_mode: end
- name: network-evolution (animation)
  address: gif:small_world_rewire.gif
embed_visualizations:
- name: Interactive network animation
  url: /workspace/studies/03-small-world-rewiring/viz/small_world_rewire.html
expected_behavior:
- name: sw-conserves-edges
  observable: n_edges
  condition: edge count is unchanged throughout (rewiring, not growth)
  rationale: Each rewire moves one endpoint; it never adds or removes an edge.
- name: sw-shortcuts
  observable: mean_degree
  condition: mean degree conserved while long-range shortcuts appear
  rationale: Rewiring conserves total degree but introduces cross-ring shortcuts.
behavior_tests:
- name: sw-edge-count-conserved
  classification: invariant
  description: Edge count equals the initial ring-lattice edge count at the end.
  measure:
    kind: flat
    observable: n_edges
    reduce: last
  pass_if:
    op: equals
    value: 56
    tolerance: 0
  units: edges
  requires_simulation: 'yes'
  cites:
  - watts1998smallworld
- name: sw-node-count-conserved
  classification: invariant
  description: Node count is unchanged (no growth).
  measure:
    kind: flat
    observable: n_nodes
    reduce: last
  pass_if:
    op: equals
    value: 28
    tolerance: 0
  units: nodes
  requires_simulation: 'yes'
  cites:
  - watts1998smallworld
bibliography:
  bib_keys:
  - watts1998smallworld
  - newman2003structure
findings:
- name: small_world_rewire-signature
  summary: Random rewiring of a ring lattice preserves edge count while shortcuts collapse path length
    — producing the small-world regime.
  detail: Edge and node counts stay fixed while rewired shortcuts cross the ring — the hallmark of the
    Watts–Strogatz construction. The circular layout makes each rewire visible as a chord.
report:
  verdict: Random rewiring of a ring lattice preserves edge count while shortcuts collapse path length
    — producing the small-world regime.
  verdict_status: passed
  verdict_detail: Edge and node counts stay fixed while rewired shortcuts cross the ring — the hallmark
    of the Watts–Strogatz construction. The circular layout makes each rewire visible as a chord.
