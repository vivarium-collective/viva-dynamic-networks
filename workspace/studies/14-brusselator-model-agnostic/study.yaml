schema_version: 4
name: 14-brusselator-model-agnostic
title: Model-agnostic node reactor — Brusselator (proposed)
created: '2026-10-22'
status: planned
investigation: dynamic-networks
phase: Design
confidence: Planned
question: 'Is the SBML-at-nodes architecture model-agnostic — does swapping the Repressilator for a Brusselator
  reproduce reaction–diffusion patterning on the network with no code change?

  '
hypothesis: 'Because NetworkSBMLReactors loads any SBML model and NetworkTransport diffuses any species,
  pointing them at a Brusselator yields Turing-like patterning / synchronisation on the network with the
  identical process code.

  '
objective: 'Vendor a Brusselator SBML, point the reactors at it, and reproduce a Family-B/C study to demonstrate
  model-independence.

  '
description: 'Proposed follow-up seeded from study 11. Demonstrates the node model is a plug-in, not hardcoded.


  (Baseline points at the composite this proposal would EXTEND; the new mechanism is not yet built.)

  '
