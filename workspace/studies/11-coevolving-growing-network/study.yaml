findings:
- name: growing_repressilator_network-result
  summary: 'Continuous SBML dynamics run correctly on a network being built node-by-node by a PBG reaction:
    the system stays bounded and oscillating, and most newcomers entrain through the dense local coupling
    — but synchronisability is topology-dependent, with weakly-attached (low-degree) nodes lagging the
    synchronised core.'
  detail: 'The headline synthesis: a forest-fire growth reaction builds the network node-by-node WHILE
    a COPASI/SBML Repressilator runs in every node and proteins diffuse along the (changing) edges. Each
    newcomer arrives at its own limit-cycle phase; the dense local coupling pulls most of them into the
    synchronised core, so the across-node spread stays small relative to the oscillation amplitude even
    as the network grows. Synchronisability is topology-dependent, though: a newcomer that attaches with
    only a single edge couples weakly and lags (Rodrigues et al. 2016). This is the companion to the uniform-degree
    rewiring study (12), which synchronises fully. Topology (dynamics OF the network) and continuous multi-species
    node state (dynamics ON the network) co-evolve in one process-bigraph composite.'
