schema_version: 4
name: 11-coevolving-growing-network
title: Dynamics on a growing network — reactors entrain as the graph is built
created: '2026-10-22'
status: completed
investigation: dynamic-networks
phase: Decide
question: 'Can SBML reactor dynamics run on a network whose topology is itself being built by a process-bigraph
  reaction, and do newcomers entrain?

  '
hypothesis: 'Running the Family-B reactors + transport on a graph that a Family-A growth reaction is simultaneously
  building, each newcomer joins at its own phase and is pulled into synchrony by the dense local coupling
  — the full synthesis of dynamics OF and ON the network.

  '
objective: 'Run the growing_repressilator_network composite — SBML reactors + transport on a topology
  that a PBG reaction reconfigures during the run — and measure synchrony.

  '
description: 'Continuous SBML dynamics run correctly on a network being built node-by-node by a PBG reaction;
  each newcomer entrains, and the growing network synchronises.


  This is a Family-C (co-evolution) study: a Family-A reaction reconfigures the graph WHILE the Family-B
  SBML reactors + inter-node transport run on it. See viz/ for the concentration-on-network animation
  and the per-node time series.

  '
claim: 'Continuous SBML dynamics run correctly on a network being built node-by-node by a PBG reaction:
  the system stays bounded and oscillating, and most newcomers entrain through the dense local coupling
  — but synchronisability is topology-dependent, with weakly-attached (low-degree) nodes lagging the synchronised
  core.'
confidence: Accepted
