expected_behavior:
- name: network-grows
  observable: n_nodes
  condition: the network grows from its seed during the run
  rationale: A forest-fire growth reaction adds nodes on its own (slower) interval while the reactors
    run.
- name: mostly-entrained
  observable: sync_std
  condition: the across-node spread stays small relative to the oscillation amplitude (most nodes entrained)
  rationale: Dense local coupling entrains most newcomers; low-degree nodes may lag.
behavior_tests:
- name: grows-and-mostly-entrains
  classification: quantitative
  description: Across-node PX spread stays well below the oscillation amplitude even as the network grows
    (most nodes entrained).
  measure:
    kind: flat
    observable: sync_std
    reduce: last
  pass_if:
    op: at_most
    value: 150.0
  units: concentration
  requires_simulation: 'yes'
