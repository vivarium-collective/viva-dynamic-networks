followup_proposals:
- id: model-agnostic-brusselator
  title: Model-agnostic node reactor (Brusselator)
  status: accepted
  seeded_study: 14-brusselator-model-agnostic
  motivation: Families B/C hardcode the Repressilator; the architecture should accept any SBML model with
