schema_version: 4
name: 15-sbml-adaptive-coevolution
title: SBML-driven adaptive coevolution (proposed)
created: '2026-10-22'
status: planned
investigation: dynamic-networks
phase: Design
confidence: Planned
question: 'When the continuous node state (an SBML readout) itself drives the rewiring, does a self-organised
  modular topology emerge?

  '
hypothesis: 'Letting each node rewire toward neighbours with a similar SBML observable (e.g. oscillator
  phase) closes the state→topology feedback and self-organises the network into phase-coherent modules.

  '
objective: 'Couple an SBML-observable-driven rewiring rule to the Family-B reactors, so topology and continuous
  state co-adapt (the continuous generalisation of study 07).

  '
description: 'Proposed follow-up seeded from study 07. The continuous-state analogue of adaptive coevolution:
  the richest point in the OF↔ON feedback loop.


  (Baseline points at the composite this proposal would EXTEND; the new mechanism is not yet built.)

  '
