title: Quorum-sensing coupling (proposed)
created: '2026-10-22'
status: planned
investigation: dynamic-networks
phase: Design
confidence: Planned
question: 'Does coupling through a single diffusible signal molecule synchronise the networked reactors
  as effectively as diffusing the internal proteins?

  '
hypothesis: 'A dedicated autoinducer species produced and sensed per node, diffusing along the edges,
  provides indirect coupling sufficient for synchronisation at lower transport flux than direct protein
  diffusion.

  '
objective: 'Extend the node SBML model with a signaling species and diffuse only that molecule; compare
  synchronisation to study 09.

  '
description: 'Proposed follow-up seeded from study 09. Replaces all-protein diffusion with biologically-realistic
  quorum-sensing coupling via one autoinducer.


  (Baseline points at the composite this proposal would EXTEND; the new mechanism is not yet built.)

  '
