glossary:
- term: reaction (process-bigraph)
  definition: A structural rewrite of the bigraph emitted as _add/_remove sentinels on a map port; here
    it adds/removes network nodes and edges.
- term: degree
  definition: Number of edges incident to a node.
- term: scale-free
  definition: A network whose degree distribution has a power-law tail — a few very-high-degree hubs.
- term: small-world
  definition: High local clustering with short global path lengths.
- term: densification
  definition: Edge count growing super-linearly in node count as a network evolves.
