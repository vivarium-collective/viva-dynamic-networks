schema_version: 2
name: dynamic-networks
title: Dynamic Networks — a catalog of network-reconfiguring rules
created: '2026-10-22'
status: running
question: 'How do different local rules reshape a network over time, and can a single process-bigraph
  process — driven by pluggable reactions — reproduce the canonical families of network dynamics, each
  with a clear visualization of the network evolving?

  '
hypothesis: 'One generalized NetworkDynamicsProcess, reconfiguring a graph through process-bigraph _add/_remove
  structural reactions, can reproduce the signature topology of every classic dynamic-network model —
  random growth, preferential attachment, small-world rewiring, fitness, duplication-divergence, forest-fire,
  adaptive coevolution, and activity-driven temporal networks — distinguishable by emitted structural
  metrics and by eye in the animations.

  '
description: 'This investigation is a catalog: each study instantiates the same generalized process with
  a different registered reaction and shows the network evolving under that rule as an interactive animation
  and a GIF. Family A (studies 1–8) covers the dynamics OF networks — rules that rewire topology. A later
  Family B will add continuous multi-species dynamics ON the networks (an SBML simulator at each node
  via viva-copasi, with transport/diffusion along edges).

  '
lead: 'Network science has many models of how graphs grow and rewire, usually studied one at a time. Here
  they become a single reusable machine: a process-bigraph process whose structural reactions are swapped
  to produce each dynamic, so the whole family is directly comparable — same substrate, same metrics,
  same visualization — and extensible with one new reaction per new rule.

  '
executive:
  what_is_this: 'A catalog investigation: eight studies, each a different network-reconfiguring rule implemented
    as a process-bigraph reaction on a shared graph substrate, each with an evolving-network animation
    and GIF.'
  verdict: One generalized process reproduces all 8 Family-A dynamics; Family B runs a real SBML Repressilator
    (via viva-copasi) at every node with inter-node diffusion; and Family C runs that reaction–diffusion
    ON a topology the process is itself reconfiguring — growing or rewiring — so topology and node state
    co-evolve.
  verdict_status: passed
  verdict_detail: 'All 8 Family-A studies pass: ER stays hub-free and connected; BA and fitness build
    dominant hubs with heavy tails; WS and adaptive conserve edges while reorganising; duplication-divergence
    reproduces heavy-tailed, clustered (and fragmenting) topology; forest-fire densifies; activity-driven
    stays sparse and blinking. The architecture is one process + a pluggable reaction registry. Family
    B adds continuous multi-species dynamics ON the network: a COPASI/SBML Repressilator per node with
    Fickian protein transport along edges — coupled oscillators synchronise (across-node spread → 0) while
    the uncoupled control retains its spread. All 10 studies pass their checks. Family C closes the loop:
    the SBML reactors + transport run WHILE a Family-A reaction reshapes the graph. On a continuously-rewired
    ring the oscillators synchronise fully; on a forest-fire-grown network most newcomers entrain while
    weakly-attached nodes lag (topology-dependent synchronisability). All 12 studies pass. Three follow-up
    directions are recorded as proposed studies (13–15): quorum-sensing coupling, a model-agnostic Brusselator
    node reactor, and SBML-state-driven adaptive coevolution.'
  decisions_needed:
  - question: Build out the proposed follow-ups (studies 13–15)?
    context: 'Families A/B/C are complete and green (12 studies). Three proposed studies — quorum-sensing
      coupling, a model-agnostic Brusselator swap, and SBML-state-driven adaptive coevolution — are scoped
      (status: planned, seeded from studies 09/11/07) as the next extensions.'
scientific_argument:
  main_claim: Classic network-dynamics models — and continuous reaction–diffusion dynamics running ON
    them, even while the topology itself changes — are all special cases of one generalized, reaction-driven
    process-bigraph composite.
  evidence_for:
  - All 8 rules run end-to-end as process-bigraph _add/_remove structural reactions on a shared node/edge
    substrate.
  - 'Each study''s structural signature matches theory: BA/fitness hubs (max degree ≫ mean), WS/adaptive
    edge conservation, forest-fire densification, activity-driven sparsity.'
  - Adding a new dynamic is a single registered reaction function — demonstrated by the breadth of the
    catalog.
  - Family B places a real COPASI/SBML Repressilator at every node (reusing viva-copasi) and couples them
    by edge diffusion; coupling synchronises the oscillators (across-node spread → 0) vs the uncoupled
    control.
  - 'Family C runs the SBML reactors + transport ON a topology a Family-A reaction is simultaneously reconfiguring
    (growing or rewiring): the rewiring ring synchronises fully, the growing network mostly entrains —
    the dynamics OF and ON the network co-evolve in one composite.'
  evidence_against:
  - The power-law exponent MLE is biased low at N≈60 (finite-size); precise exponents need far larger
    graphs.
  - Rules are faithful minimal implementations, not exhaustive variants (e.g. no non-linear PA, no aging).
  key_figures:
  - 02-preferential-attachment/viz/preferential_attachment.gif (hub emergence)
  - 03-small-world-rewiring/viz/small_world_rewire.gif (ring → small world)
  - 07-adaptive-coevolution/viz/adaptive_rewire.gif (opinion segregation)
  - 09-sbml-nodes-coupled/viz/repressilator_network_coupled.gif (synchronisation on the network)
  - 12-coevolving-rewiring-network/viz/rewiring_repressilator_network.gif (synchrony survives continual
    rewiring)
  caveats:
  - Finite-size effects on degree-distribution exponents.
  - Metrics are single-seed per study (seed 7); trends are robust but not ensemble-averaged.
biological_story: 'Networks are everywhere in biology — protein interactions, gene regulation, metabolism,
  neurons, ecological webs — and they are not static. This investigation treats the *rules* that reshape
  a network as the object of study. Duplication-divergence (study 5) is the explicit genome-evolution
  analogue: a gene duplicates, the copy inherits its partners, then diverges by losing some — reproducing
  the heavy-tailed, clustered topology of real protein-interaction networks. Preferential attachment and
  fitness capture how some nodes become hubs. Adaptive coevolution (study 7) is the conceptual bridge
  to the next phase: when the state ON the nodes feeds back on the wiring between them. Family B makes
  that concrete: a COPASI/SBML Repressilator runs in every node and its proteins diffuse along the edges,
  so connected oscillators entrain — continuous, multi-species reaction–diffusion dynamics ON the network.

  '
at_a_glance:
- study: 01-erdos-renyi-random-growth
  role: Null baseline — random growth, no hubs (Poisson degrees).
- study: 02-preferential-attachment
  role: Degree-proportional growth → scale-free hubs (Barabási–Albert).
- study: 03-small-world-rewiring
  role: Ring-lattice rewiring → small-world regime (Watts–Strogatz).
- study: 04-fitness-condensation
  role: Fitness-weighted growth → a latecomer can overtake old hubs (Bianconi–Barabási).
- study: 05-duplication-divergence
  role: Copy-then-diverge → protein-network-like topology.
- study: 06-forest-fire-densification
  role: Recursive burning → densification + shrinking diameter (Leskovec).
- study: 07-adaptive-coevolution
  role: Opinions + rewiring co-adapt → like-minded clusters (Gross–Blasius); bridge to Family B.
- study: 08-activity-driven-temporal
  role: Activity-driven firing → a blinking temporal network (Perra).
- study: 09-sbml-nodes-coupled
  role: 'Family B: a Repressilator (SBML) at each node + protein diffusion along edges → synchronisation.'
- study: 10-sbml-nodes-uncoupled
  role: 'Family B control: diffusion off (D=0) → oscillators stay out of phase.'
- study: 11-coevolving-growing-network
  role: 'Family C (synthesis): SBML reactors run while forest-fire growth BUILDS the network — most newcomers
    entrain; sync is topology-dependent.'
- study: 12-coevolving-rewiring-network
  role: 'Family C: reactors on a ring whose edges are continuously rewired — synchrony survives the changing
    wiring.'
- study: 13-quorum-sensing-coupling
  role: 'Proposed: couple via one diffusible signal molecule (quorum sensing) instead of all proteins.'
- study: 14-brusselator-model-agnostic
  role: 'Proposed: swap the Repressilator for a Brusselator to show the node model is a plug-in.'
- study: 15-sbml-adaptive-coevolution
  role: 'Proposed: let the continuous SBML state drive the rewiring — the continuous analogue of study
    07.'
