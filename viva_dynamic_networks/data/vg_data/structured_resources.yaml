name: structured_resources
version: '1'
description: 'Curated catalog of dynamic-network rules for the viva-dynamic-networks investigation. Two
  families: (A) network-rule — dynamics OF the network, topology-reconfiguring rules implemented as process-bigraph
  reactions; and (B) network-dynamics — dynamics ON the network, state evolving on nodes/edges (the later
  SBML-at-nodes + inter-node transport studies). Each card cross-links to the primary / review references
  folded into the References list below.'
resources:
- id: rule-erdos-renyi
  type: network-rule
  name: Erdős–Rényi random growth
  family: topology
  summary: Baseline null model. Edges appear (or vanish) uniformly at random, independent of node identity
    or degree — no structure beyond chance.
  rule: At each step add/remove an edge between a uniformly random pair of nodes with probability p (or
    add n nodes and wire each pair independently w.p. p).
  key_params:
  - p (edge probability)
  - n (nodes)
  - growth_mode (static/accreting)
  emergent: Poisson/binomial degree distribution; sharp giant-component percolation at <k>=1.
  pbg_reaction: reaction 'random_edge' picks two random node schema keys and sets an edge entry.
  role_in_investigation: Study 1 null baseline — the no-rule control every other rule is read against.
  references:
  - erdos1960evolution
  - newman2003structure
- id: rule-preferential-attachment
  type: network-rule
  name: Barabási–Albert preferential attachment
  family: topology
  summary: '"Rich get richer" growth: arriving nodes link to existing nodes with probability proportional
    to current degree, producing scale-free hubs.'
  rule: Each step a new node arrives with m edges; it attaches to existing node i with probability Π(i)
    = k_i / Σ_j k_j.
  key_params:
  - m (edges per new node)
  - n_final
  - seed_graph
  emergent: Power-law degree distribution P(k) ~ k^-3; a few dominant hubs.
  pbg_reaction: reaction 'attach_preferential' adds a node, samples m targets weighted by degree, writes
    edges.
  role_in_investigation: Study 2 — the canonical growth rule; visibly grows hubs on screen.
  references:
  - barabasi1999emergence
  - albert2002statistical
- id: rule-small-world-rewire
  type: network-rule
  name: Watts–Strogatz small-world rewiring
  family: topology
  summary: 'Interpolates regular lattice → random graph: start from a ring lattice and rewire each edge
    at random with probability p, yielding high clustering with short path lengths at intermediate p.'
  rule: Begin with a k-regular ring lattice; for each edge, with probability p move one endpoint to a
    uniformly random node (no self/multi-edges).
  key_params:
  - k (lattice degree)
  - p (rewiring probability)
  - n
  emergent: Small-world regime — high clustering, low diameter — for 0 < p << 1.
  pbg_reaction: reaction 'rewire_edge' detaches one endpoint of an existing edge and reattaches at random
    w.p. p.
  role_in_investigation: Study 3 — watch a tidy ring dissolve into a small world as p sweeps up.
  references:
  - watts1998smallworld
  - newman2003structure
- id: rule-fitness-attachment
  type: network-rule
  name: Bianconi–Barabási fitness ("fit-get-richer")
  family: topology
  summary: Preferential attachment weighted by an intrinsic per-node fitness, so a latecomer with high
    fitness can overtake older hubs — unlike pure BA.
  rule: New node attaches to i with probability Π(i) ∝ η_i · k_i, where η_i is a fitness drawn from a
    fixed distribution ρ(η).
  key_params:
  - m
  - fitness_distribution ρ(η)
  - n_final
  emergent: Fitness-dependent scaling; possible "winner-takes-all" (condensation) regime.
  pbg_reaction: reaction 'attach_fitness' weights target sampling by η_i·k_i; η stored on node schema.
  role_in_investigation: 'Study 4 — contrast with BA: show a young high-fitness node climbing to hub status.'
  references:
  - bianconi2001competition
  - albert2002statistical
- id: rule-duplication-divergence
  type: network-rule
  name: Duplication–divergence (biological growth)
  family: topology
  summary: 'Genome-evolution analogue: a new node copies an existing node''s edges, then each copied edge
    is independently retained or dropped — reproduces observed protein-interaction network topology.'
  rule: Pick a random node u; add a duplicate v inheriting all of u's edges; retain each inherited edge
    with probability q (optionally add a u–v link w.p. p).
  key_params:
  - q (edge-retention probability)
  - p (self-link probability)
  - n_final
  emergent: Power-law tail; non-self-averaging — identical params yield a wide family of networks.
  pbg_reaction: reaction 'duplicate_divergent' copies a node's edge set then prunes each copied edge w.p.
    1-q.
  role_in_investigation: Study 5 — the biologically-motivated rule; bridges toward the SBML-at-nodes phase.
  references:
  - vazquez2003modeling
  - ispolatov2005duplication
- id: rule-forest-fire
  type: network-rule
  name: Forest-fire growth (densification)
  family: topology
  summary: New nodes "burn" recursively outward from an anchor, linking to a random subset of neighbors
    at each hop — the first generator to reproduce graph densification and shrinking diameter over time.
  rule: New node picks an ambassador, links to it, then recursively links to a geometrically-distributed
    sample of the ambassador's out/in-neighbors.
  key_params:
  - p_forward
  - p_backward (burn probabilities)
  - n_final
  emergent: Densification power law (edges super-linear in nodes); diameter shrinks as the graph grows.
  pbg_reaction: reaction 'forest_fire_attach' runs a bounded BFS burn from an anchor, writing edges to
    burned nodes.
  role_in_investigation: Study 6 — the time-evolution rule; densification is striking in the animation.
  references:
  - leskovec2007graph
- id: rule-adaptive-rewire
  type: network-rule
  name: Adaptive / coevolutionary rewiring
  family: topology
  summary: 'Topology and node state coevolve: nodes rewire their links in response to the dynamics running
    on them (e.g. cut ties to "infected"/dissimilar neighbors, form ties to similar ones) — the natural
    bridge between Family A and Family B.'
  rule: Per step, with rate w a node drops an edge to a neighbor in a disfavored state and reconnects
    to a random (or state-matched) node; node states update by an on-network process (SIS, voter, …).
  key_params:
  - w (rewiring rate)
  - state_rule
  - matching_criterion
  emergent: Self-organized topology, dynamic equilibria, bistability; small rule tweaks → drastic topology
    shifts.
  pbg_reaction: reaction 'adaptive_rewire' reads neighbor state, conditionally detaches + reattaches;
    couples to a Family-B node process.
  role_in_investigation: Study 7 — the coevolution capstone of Family A; explicitly links topology to
    on-node dynamics.
  references:
  - gross2008adaptive
- id: rule-activity-driven
  type: network-rule
  name: Activity-driven temporal networks
  family: topology
  summary: 'Instead of a growing graph, a sequence of instantaneous contact graphs: each node fires with
    its own activity rate and, when active, connects to a few random others for one time window, then
    the edges vanish.'
  rule: Each node i has activity a_i ∝ x_i (x_i ~ F(x)); per step i activates w.p. a_i·Δt and creates
    m edges to random nodes; all edges reset next step.
  key_params:
  - activity_distribution F(x)
  - m (edges per active node)
  - Δt
  emergent: Time-integrated degree reproduces the activity distribution; sets the stage for spreading
    on temporal graphs.
  pbg_reaction: reaction 'activity_fire' clears the edge set each step, then for each active node writes
    m random edges.
  role_in_investigation: Study 8 — temporal (blinking) networks; contrasts accreting vs. instantaneous
    topology.
  references:
  - perra2012activity
  - holme2012temporal
- id: dyn-sis-sir
  type: network-dynamics
  name: Epidemic spreading (SIS / SIR)
  family: on-network
  summary: 'Canonical contagion: each node is Susceptible/Infected(/Recovered); infection transmits along
    edges, recovery is spontaneous — threshold behavior is set by network topology (vanishing threshold
    on scale-free hubs).'
  rule: S→I at rate β per infected neighbor; I→S (SIS) or I→R (SIR) at rate μ.
  key_params:
  - β (infection rate)
  - μ (recovery rate)
  - patient_zero
  node_state: discrete (S/I/R) — the entry point before continuous SBML states.
  role_in_investigation: Study 9 — simplest dynamics ON a (fixed or rule-grown) network; discrete node
    state.
  references:
  - pastorsatorras2015epidemic
- id: dyn-metapopulation-rd
  type: network-dynamics
  name: Reaction–diffusion metapopulation (SBML-at-nodes template)
  family: on-network
  summary: Each node is a well-mixed reactor holding continuous concentrations of multiple species that
    react locally; species diffuse/transport between connected nodes along edges. The template for the
    SBML-simulator-per-node phase.
  rule: 'Local: dX_i/dt = R(X_i) (node reaction network / SBML model). Coupling: diffusive flux D·(X_j
    − X_i) along each edge (i,j), optionally scaled by edge weight.'
  key_params:
  - per-node reaction model (SBML)
  - D (diffusion coefficients per species)
  - edge weights
  node_state: continuous, multi-species (an SBML model instance per node).
  pbg_reaction: topology set by a Family-A rule; each node runs an SBML Process; a transport Process moves
    species across edges.
  role_in_investigation: 'Study 10+ — the headline later phase: continuous multi-species dynamics ON an
    evolving network with inter-node transport.'
  references:
  - colizza2007reaction
  - pastorsatorras2015epidemic
  - elowitz2000repressilator
- id: dyn-kuramoto
  type: network-dynamics
  name: Kuramoto synchronization
  family: on-network
  summary: Each node is a phase oscillator with its own natural frequency, pulled toward its neighbors'
    phases; the network undergoes a transition to collective synchrony as coupling increases — topology
    shapes the transition.
  rule: dθ_i/dt = ω_i + (K/k_i)·Σ_{j∈N(i)} sin(θ_j − θ_i).
  key_params:
  - K (coupling strength)
  - ω distribution
  - topology
  node_state: continuous scalar (phase) — a gentle continuous-dynamics example.
  role_in_investigation: Optional on-network study — a visually compelling continuous example (phases
    locking).
  references:
  - rodrigues2016kuramoto
  - acebron2005kuramoto
- id: dyn-voter-consensus
  type: network-dynamics
  name: Voter / consensus dynamics
  family: on-network
  summary: 'Opinion dynamics: a random node copies the state of a random neighbor; network structure governs
    whether the system reaches consensus and how fast.'
  rule: Pick node i and neighbor j at random; set state(i) ← state(j).
  key_params:
  - n_opinions
  - update_scheme (node/edge/link)
  - topology
  node_state: discrete opinion label.
  role_in_investigation: Optional on-network study — pairs naturally with adaptive rewiring (Family A
    coevolution).
  references:
  - castellano2009statistical
  - gross2008adaptive
